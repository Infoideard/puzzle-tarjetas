:root{--bg:#eaf0ed;--sf:#fff;--ink:#12222a;--mut:#5b6e75;--ln:#d8e1dd;--ac:#0f6b5c;--acs:#d9efe8;--wr:#a8650d;--wrs:#fbeccf;--dg:#b3261e;--dgs:#fbdcd9;--in:#1d5f9e;--ins:#dbeaf8;--sh:0 1px 2px rgba(18,34,42,.06),0 8px 24px rgba(18,34,42,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c161b;--sf:#15242b;--ink:#e8f0ee;--mut:#97abb2;--ln:#273a43;--ac:#4cc3a9;--acs:#17382f;--wr:#f0b45a;--wrs:#3b2d12;--dg:#ff8a80;--dgs:#43191a;--in:#7db8f0;--ins:#14304a;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c161b;--sf:#15242b;--ink:#e8f0ee;--mut:#97abb2;--ln:#273a43;--ac:#4cc3a9;--acs:#17382f;--wr:#f0b45a;--wrs:#3b2d12;--dg:#ff8a80;--dgs:#43191a;--in:#7db8f0;--ins:#14304a;--sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 400px at 85% -80px,color-mix(in srgb,var(--ac) 16%,transparent),transparent),var(--bg);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.w{max-width:1040px;margin:0 auto;padding:14px 14px 110px}
.hd{display:none!important}
button,select,input{font:inherit;color:inherit}
.br{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--mut);font-weight:600;font-size:14px}.lg{height:28px;width:auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ac)}.tabs button.on svg{stroke-width:2.3}
.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.cv:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(min-width:761px){.tabs{position:static;display:inline-flex;gap:4px;border:1px solid var(--ln);border-radius:14px;padding:4px;margin-bottom:16px}.tabs button{flex-direction:row;gap:7px;font-size:14px;padding:8px 14px}.w{padding-bottom:50px}}
h2{margin:0 0 10px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:var(--bg)}.btn.d{color:var(--dg)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px;border-radius:20px;color:#fff;background:radial-gradient(90% 120% at 100% 0%,rgba(123,224,200,.28),transparent 60%),linear-gradient(135deg,#0a3540,#0f6b5c);box-shadow:var(--sh);margin-bottom:12px}
.hero small{opacity:.75;display:block}.hero b{font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}.hero em{font-style:normal;opacity:.85;font-size:17px}
.ring{width:96px;height:96px;flex:none}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.k small{color:var(--mut);display:block}.k b{font-size:20px;font-weight:800;display:block;margin-top:2px}
.tb{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin-bottom:14px}
.tb input,.tb select,.fl input,.fl select,.fi input,.fi select{width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;overflow:hidden;box-shadow:var(--sh);align-self:start}
.card.al{border-color:var(--wr)}.card.dg{border-color:var(--dg)}
.cv{display:flex;flex-direction:column;justify-content:space-between;gap:20px;width:100%;min-height:178px;border:0;padding:18px;text-align:left;cursor:pointer;color:#fff;background:radial-gradient(110% 90% at 100% 0%,hsl(var(--h) 60% 44%),transparent 62%),linear-gradient(135deg,hsl(var(--h) 45% 20%),hsl(calc(var(--h) + 28) 48% 32%))}
.cv .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cv small{opacity:.85;font-size:13px;font-weight:600}
.chip{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#f3dc92,#c39a42)}
.cv b{font-size:20px;font-weight:800;letter-spacing:-.01em;display:block}
.cv .n{letter-spacing:.14em;opacity:.9}
.cv .t{font-size:12px;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:2px 9px}
.cv .a{background:#fff;color:#8a1c14;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px}
.det{padding:14px 16px 16px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:2px 0 4px}.bar i{display:block;height:100%;background:var(--ac)}.bar i.w2{background:var(--wr)}.bar i.d2{background:var(--dg)}
.us{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{padding:5px 0;text-align:right;border-bottom:1px solid var(--ln);font-size:14px}
th:first-child,td:first-child{text-align:left;color:var(--mut)}th{font-weight:600;color:var(--mut);font-size:12px}
.dt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 10px;font-size:13px;margin:8px 0}.dt span{color:var(--mut);display:block;font-size:12px}
.ch{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.c{font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px}
.c.danger{background:var(--dgs);color:var(--dg)}.c.warn{background:var(--wrs);color:var(--wr)}.c.info{background:var(--ins);color:var(--in)}.c.ok{background:var(--acs);color:var(--ac)}
.ac{display:flex;gap:6px;margin-top:8px}.ac .btn{padding:7px 12px;font-size:13px}
.em{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--mut);background:var(--sf);border:1px dashed var(--ln);border-radius:16px}
.fm{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:14px;max-width:640px}
.fm h3{margin:0 0 10px;font-size:16px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fl label,.fi label{display:block;font-size:12px;color:var(--mut)}.fl .f1{grid-column:1/-1}
.fl fieldset{grid-column:1/-1;border:1px solid var(--ln);border-radius:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 10px}.fl legend{font-size:12px;font-weight:600;padding:0 4px}
.fi{display:grid;gap:10px}
.ft{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
dialog{border:1px solid var(--ln);border-radius:18px;background:var(--sf);color:var(--ink);padding:18px;width:min(480px,94vw);max-height:92vh}dialog::backdrop{background:rgba(0,0,0,.5)}dialog h2{font-size:19px}
.op{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.op:has(input:checked){border-color:var(--ac);background:var(--acs)}.op input{width:auto;margin-right:8px}.op span{flex:1}
.ex{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pr{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--ln)}
.dd{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--acs);color:var(--ac);padding:5px 0}.dd b{font-size:18px;margin:0;line-height:1}.dd small{font-size:11px;color:inherit}
.pi{flex:1;min-width:0}.pi b{font-size:15px;margin:0}.pi small{color:var(--mut)}
.mc{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:12px}
.sc{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:4px 14px;box-shadow:var(--sh)}
.sc table{margin:0;min-width:520px}.sc th,.sc td{text-align:left;padding:9px 6px}.sc td:last-child,.sc th:last-child{text-align:right}.sc td:first-child{color:inherit}
#ts{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;text-align:center}#ts.on{opacity:1}
@media(max-width:760px){.tb{grid-template-columns:1fr 1fr}.tb input{grid-column:1/-1}.gr{grid-template-columns:1fr}.fl fieldset{grid-template-columns:1fr}.hero{padding:18px}}
@media(min-width:761px){#ts{bottom:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const KC='tarjetas_v1',KH='puzzle_hist_v1',KS='puzzle_cfg_v1';
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
let cards=ld(KC,[]),hist=ld(KH,[]),cfg=Object.assign({nombre:'',tema:'auto',aPago:7,aCorte:3,aPlastico:60},ld(KS,{}));
let edit=null,payId=null,warned=false;const opened=new Set();
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){if(!warned){warned=true;toast('No se pudo guardar en este navegador. Descarga un respaldo en Ajustes.')}}}
const saveC=()=>put(KC,cards),saveH=()=>put(KH,hist),saveS=()=>put(KS,cfg);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>0?n:0};
const fmt=(n,p)=>p+' '+n.toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
const R=n=>fmt(n,'RD$'),U=n=>fmt(n,'US$'),M=(n,c)=>c==='usd'?U(n):R(n);
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const days=d=>Math.round((d-today())/864e5);
const fs=d=>d.toLocaleDateString('es-DO',{day:'numeric',month:'short'});
const plural=n=>n===1?'1 día':n+' días';
const mmaa=s=>s?s.slice(5,7)+'/'+s.slice(2,4):'';
const hue=s=>[...s].reduce((a,ch)=>a+ch.charCodeAt(0),0)*7%360;
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dF=(y,m,d)=>new Date(y,m,Math.min(d,dim(y,m)));
function nextOcc(d){const t=today();let x=dF(t.getFullYear(),t.getMonth(),d);return x<t?dF(t.getFullYear(),t.getMonth()+1,d):x}
function dueDate(cd,pd){const t=today();if(!cd)return nextOcc(pd);let lc=dF(t.getFullYear(),t.getMonth(),cd);if(lc>t)lc=dF(t.getFullYear(),t.getMonth()-1,cd);let x=dF(lc.getFullYear(),lc.getMonth(),pd);if(x<=lc)x=dF(lc.getFullYear(),lc.getMonth()+1,pd);return x}
const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)};
function parseVence(s){s=s.trim();if(!s)return'';const m=s.match(/^(\d{1,2})\s*\/\s*(\d{2}|\d{4})$/)||s.match(/^(\d{2})(\d{2})$/);if(!m)return null;const mo=+m[1],y=m[2].length===2?2000+ +m[2]:+m[2];if(mo<1||mo>12)return null;return y+'-'+String(mo).padStart(2,'0')+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0')}
function applyTheme(){const r=document.documentElement;cfg.tema==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',cfg.tema)}

function info(c){
 const pend=c.dop.m>0||(c.multi&&c.usd.m>0),al=[];
 const dc=c.corteDia?nextOcc(c.corteDia):null,dp=c.pagoDia?dueDate(c.corteDia,c.pagoDia):null,dv=c.vence?new Date(c.vence+'T00:00:00'):null;
 if(pend&&dp){const n=days(dp);
  if(n<0)al.push(['danger','Pago vencido hace '+plural(-n)]);
  else if(n===0)al.push(['danger','El pago vence hoy']);
  else if(n<=Math.min(2,cfg.aPago))al.push(['danger','Pago vence en '+plural(n)]);
  else if(n<=cfg.aPago)al.push(['warn','Pago vence en '+plural(n)])}
 if(dc){const n=days(dc);if(n<=cfg.aCorte)al.push(['info',n===0?'Corte hoy':'Corte en '+plural(n)])}
 if(dv){const n=days(dv);
  if(n<0)al.push(['danger','Plástico vencido']);
  else if(n<=cfg.aPlastico)al.push([n<=30?'danger':'warn','Plástico vence en '+plural(n)])}
 return{pend,al,dc,dp,dv,sev:al.some(a=>a[0]==='danger')?2:al.some(a=>a[0]==='warn')?1:0};
}

function render(){
 let tD=0,tU=0,aD=0,aU=0,lim=0,pc=0,hasU=false,na=0;const A=[];
 cards.forEach(c=>{const i=info(c);tD+=c.dop.t;lim+=c.limDOP;aD+=Math.max(0,c.limDOP-c.dop.t);if(c.multi){hasU=true;tU+=c.usd.t;aU+=Math.max(0,c.limUSD-c.usd.t)}if(i.pend)pc++;i.al.forEach(a=>{A.push([a,c]);na++})});
 const hr=new Date().getHours();$('#gt').textContent=cfg.nombre?(hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches')+', '+cfg.nombre:'Resumen';
 const pct=lim?Math.min(100,tD/lim*100):0,C=2*Math.PI*40;
 $('#hero').innerHTML=`<div class="hero"><div><small>Deuda total</small><b>${R(tD)}</b>${hasU?`<em>${U(tU)}</em>`:''}</div><svg class="ring" viewBox="0 0 100 100" role="img" aria-label="Uso del crédito ${pct.toFixed(0)}%"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="${pct>90?'#ff9a8f':pct>70?'#f3c46b':'#7be0c8'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*pct/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">${pct.toFixed(0)}%</text></svg></div>`;
 $('#kp').innerHTML=`<div class="k"><small>Crédito disponible</small><b>${R(aD)}</b>${hasU?`<small>${U(aU)}</small>`:''}</div><div class="k"><small>Pagos pendientes</small><b>${pc} de ${cards.length}</b></div><div class="k"><small>Alertas activas</small><b>${na}</b></div>`;
 const P=cards.map(c=>({c,i:info(c)})).filter(x=>x.i.pend&&x.i.dp).sort((a,b)=>a.i.dp-b.i.dp).slice(0,5);
 $('#pp').innerHTML=P.length?`<div class="k" style="margin-bottom:12px"><b style="font-size:16px;margin-bottom:6px">Próximos pagos</b>${P.map(({c,i})=>{const n=days(i.dp),mn=[c.dop.m>0?R(c.dop.m):'',c.multi&&c.usd.m>0?U(c.usd.m):''].filter(Boolean).join(' + ');return `<div class="pr"><div class="dd"><b>${i.dp.getDate()}</b><small>${i.dp.toLocaleDateString('es-DO',{month:'short'})}</small></div><div class="pi"><b>${esc(c.nombre||c.banco)}</b><small>Mínimo ${mn}</small></div><span class="c ${n<=2?'danger':n<=cfg.aPago?'warn':'ok'}">${n<0?'Vencido':n===0?'Hoy':plural(n)}</span></div>`}).join('')}</div>`:'';
 $('#al').innerHTML=A.length?`<div class="k"><b style="font-size:16px;margin-bottom:8px">Requiere atención</b><div style="display:grid;gap:7px">${A.map(([a,c])=>`<div><span class="c ${a[0]}">${esc(a[1])}</span> ${esc(c.nombre||c.banco)}</div>`).join('')}</div></div>`:(cards.length?'<div class="em">No tienes alertas por ahora.</div>':'');
 const fb=$('#fb'),cur=fb.value,bs=[...new Set(cards.map(c=>c.banco).filter(Boolean))].sort();
 fb.innerHTML='<option value="">Todos los bancos</option>'+bs.map(b=>`<option>${esc(b)}</option>`).join('');fb.value=bs.includes(cur)?cur:'';
 const q=$('#q').value.trim().toLowerCase(),m=$('#fm').value,e=$('#fe').value,so=$('#so').value;
 let L=cards.map(c=>({c,i:info(c)})).filter(({c,i})=>(!q||(c.banco+' '+c.nombre+' '+c.u4).toLowerCase().includes(q))&&(!fb.value||c.banco===fb.value)&&(!m||(m==='multi')===c.multi)&&(!e||(e==='pend'&&i.pend)||(e==='ok'&&!i.pend)||(e==='al'&&i.al.length)));
 const t=x=>x.i.dp&&x.i.pend?x.i.dp.getTime():9e15;
 L.sort((a,b)=>so==='dop'?b.c.dop.t-a.c.dop.t:so==='usd'?b.c.usd.t-a.c.usd.t:so==='banco'?a.c.banco.localeCompare(b.c.banco):t(a)-t(b));
 $('#gr').innerHTML=L.length?L.map(({c,i})=>cardHtml(c,i)).join(''):`<div class="em">${cards.length?'Ninguna tarjeta coincide con los filtros.':'Aún no tienes tarjetas. Ve a Agregar para registrar la primera.'}</div>`;
 renderHist();
}
function cardHtml(c,i){
 const u=c.limDOP>0?Math.min(100,c.dop.t/c.limDOP*100):0,cls=u>90?'d2':u>70?'w2':'',op=opened.has(c.id);
 const row=(l,a,b)=>`<tr><td>${l}</td><td>${a}</td>${c.multi?`<td>${b}</td>`:''}</tr>`;
 const chips=i.al.map(a=>`<span class="c ${a[0]}">${esc(a[1])}</span>`).join('')||`<span class="c ok">${i.pend?'Sin alertas':'Al día'}</span>`;
 return `<article class="card ${i.sev===2?'dg':i.sev===1?'al':''}" data-id="${c.id}">
 <button class="cv" style="--h:${hue(c.banco+c.nombre)}" data-a="tog" aria-expanded="${op}"><span class="r"><small>${esc(c.banco)}</small><span class="t">${c.multi?'Multimoneda':'Solo RD$'}</span></span><span class="chip"></span><span class="r"><span><b>${esc(c.nombre||'Tarjeta')}</b><small class="n">${c.u4?'•••• '+esc(c.u4):'••••'}</small></span>${i.al.length?'<span class="a">Requiere atención</span>':''}</span></button>
 <div class="det ${op?'':'hd'}"><div class="bar"><i class="${cls}" style="width:${u.toFixed(0)}%"></i></div><div class="us">Usado ${u.toFixed(0)}% del límite en pesos</div>
 <table><thead><tr><th></th><th>RD$</th>${c.multi?'<th>US$</th>':''}</tr></thead><tbody>${row('Balance total',R(c.dop.t),U(c.usd.t))}${row('Balance al corte',R(c.dop.c),U(c.usd.c))}${row('Pago mínimo',R(c.dop.m),U(c.usd.m))}${row('Límite',R(c.limDOP),U(c.limUSD))}${row('Disponible',R(Math.max(0,c.limDOP-c.dop.t)),U(Math.max(0,c.limUSD-c.usd.t)))}</tbody></table>
 <div class="dt"><div><span>Corte</span>${i.dc?'Día '+c.corteDia+' · '+fs(i.dc):'Sin definir'}</div><div><span>Límite de pago</span>${i.dp?'Día '+c.pagoDia+' · '+fs(i.dp):'Sin definir'}</div><div><span>Plástico vence</span>${i.dv?mmaa(c.vence):'Sin fecha'}</div></div>
 <div class="ch">${chips}</div>
 <div class="ac"><button class="btn p" data-a="pay">Pagar</button><button class="btn" data-a="edit">Editar</button><button class="btn d" data-a="del">Eliminar</button></div></div></article>`;
}

/* Historial y exportación */
const fdt=s=>new Date(s).toLocaleString('es-DO',{dateStyle:'medium',timeStyle:'short'});
function hFiltered(){const f=$('#hf').value;return hist.filter(h=>!f||h.cid===f).sort((a,b)=>b.f.localeCompare(a.f))}
function renderHist(){
 const hf=$('#hf'),cur=hf.value;
 hf.innerHTML='<option value="">Todas las tarjetas</option>'+[...new Map(hist.map(h=>[h.cid,h.tj]))].map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`).join('');
 hf.value=[...hf.options].some(o=>o.value===cur)?cur:'';
 const L=hFiltered();let d=0,u=0;L.forEach(h=>h.mon==='usd'?u+=h.monto:d+=h.monto);
 const mo=[];for(let k=5;k>=0;k--){const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-k);mo.push({y:x.getFullYear(),m:x.getMonth(),v:0})}
 L.forEach(h=>{if(h.mon==='usd')return;const x=new Date(h.f),z=mo.find(z=>z.y===x.getFullYear()&&z.m===x.getMonth());if(z)z.v+=h.monto});
 const mx=Math.max(...mo.map(z=>z.v),1);
 const chart=d>0?`<div class="mc"><small class="us">Pagos en RD$ por mes</small><svg viewBox="0 0 300 96" style="width:100%;height:auto" role="img" aria-label="Pagos por mes">${mo.map((z,i)=>{const h=z.v?Math.max(4,Math.round(z.v/mx*54)):3;return `<rect x="${i*50+10}" y="${66-h}" width="30" height="${h}" rx="6" style="fill:var(--ac);opacity:${z.v?1:.25}"/><text x="${i*50+25}" y="84" text-anchor="middle" font-size="11" style="fill:var(--mut)">${new Date(z.y,z.m,1).toLocaleDateString('es-DO',{month:'short'})}</text>`+(z.v?`<text x="${i*50+25}" y="${60-h}" text-anchor="middle" font-size="10" style="fill:var(--ink)">${z.v>=1000?(z.v/1000).toFixed(z.v>=10000?0:1)+'k':z.v.toFixed(0)}</text>`:'')}).join('')}</svg></div>`:'';
 $('#hl').innerHTML=L.length?`${chart}<div class="sc"><table><thead><tr><th>Fecha</th><th>Tarjeta</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>${L.map(h=>`<tr><td>${fdt(h.f)}</td><td>${esc(h.tj)}</td><td>${esc(h.tipo)}</td><td>${M(h.monto,h.mon)}</td></tr>`).join('')}</tbody></table></div><p class="us">Total pagado: ${R(d)}${u?' · '+U(u):''}</p>`:'<div class="em">Aún no hay pagos registrados. Cuando uses Pagar en una tarjeta, aparecerá aquí.</div>';
}
async function saveFile(name,data){
 try{const d=window.claude?await claude.use('downloads'):null;if(d){await d.save({filename:name,data});toast('Archivo listo');return}}catch(e){if(e&&e.code==='declined')return}
 try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data])),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Descarga iniciada')}catch(e){toast('No se pudo descargar el archivo')}
}
const stamp=()=>new Date().toISOString().slice(0,10);
function hRows(){return hFiltered().map(h=>[fdt(h.f),h.tj,h.tipo,h.mon==='usd'?'US$':'RD$',h.monto])}
const HEAD=['Fecha','Tarjeta','Concepto','Moneda','Monto'];
function guardExp(){if(!hist.length){toast('No hay pagos para exportar');return false}return true}
$('#xX').onclick=()=>{if(!guardExp())return;if(!window.XLSX){toast('No se pudo cargar el exportador de Excel');return}
 const ws=XLSX.utils.aoa_to_sheet([HEAD,...hRows()]);ws['!cols']=[{wch:22},{wch:24},{wch:22},{wch:8},{wch:14}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Historial');
 saveFile('historial-pagos-'+stamp()+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]))};
$('#xP').onclick=()=>{if(!guardExp())return;if(!window.jspdf){toast('No se pudo cargar el exportador de PDF');return}
 const doc=new window.jspdf.jsPDF();doc.setFontSize(15);doc.text('Historial de pagos - Puzzle Tarjetas',14,16);
 doc.autoTable({startY:22,head:[HEAD],body:hRows().map(r=>[...r.slice(0,4),r[3]+' '+r[4].toLocaleString('es-DO',{minimumFractionDigits:2})]),headStyles:{fillColor:[15,107,92]},columnStyles:{4:{halign:'right'}}});
 saveFile('historial-pagos-'+stamp()+'.pdf',doc.output('blob'))};
$('#xS').onclick=()=>{if(!guardExp())return;
 const csv='\ufeff'+[HEAD,...hRows()].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 saveFile('historial-pagos-'+stamp()+'.csv',csv);toast('Para Google Sheets: abre sheets.new y usa Archivo > Importar')};
$('#hf').onchange=renderHist;

/* Formulario */
const ids=['banco','nombre','u4','limDOP','limUSD','corteDia','pagoDia','vence','cDOP','mDOP','tDOP','cUSD','mUSD','tUSD'];
['corteDia','pagoDia'].forEach(k=>$('#'+k).innerHTML='<option value="">Sin definir</option>'+Array.from({length:31},(_,i)=>`<option value="${i+1}">Día ${i+1}</option>`).join(''));
function toggleUsd(){document.querySelectorAll('.usd').forEach(e=>e.classList.toggle('hd',!$('#multi').checked))}
function openForm(id){
 edit=id;const c=cards.find(x=>x.id===id)||{multi:false,dop:{},usd:{}};
 $('#fT').textContent=id?'Editar tarjeta':'Agregar tarjeta';
 const v={banco:c.banco,nombre:c.nombre,u4:c.u4,limDOP:c.limDOP,limUSD:c.limUSD,corteDia:c.corteDia,pagoDia:c.pagoDia,vence:mmaa(c.vence),cDOP:c.dop.c,mDOP:c.dop.m,tDOP:c.dop.t,cUSD:c.usd.c,mUSD:c.usd.m,tUSD:c.usd.t};
 ids.forEach(k=>$('#'+k).value=v[k]||'');$('#multi').checked=!!c.multi;toggleUsd();showTab('add');window.scrollTo(0,0);
}
function saveForm(){
 const g=k=>$('#'+k).value.trim(),m=$('#multi').checked;
 if(!g('banco')&&!g('nombre')){toast('Escribe al menos el banco o el nombre');return}
 const vv=parseVence(g('vence'));if(vv===null){toast('Escribe el vencimiento como MM/AA, por ejemplo 08/28');return}
 const c={id:edit||Date.now().toString(36),banco:g('banco'),nombre:g('nombre'),u4:g('u4').replace(/\D/g,''),multi:m,limDOP:num(g('limDOP')),limUSD:m?num(g('limUSD')):0,corteDia:+g('corteDia')||0,pagoDia:+g('pagoDia')||0,vence:vv,
  dop:{c:num(g('cDOP')),m:num(g('mDOP')),t:num(g('tDOP'))},usd:m?{c:num(g('cUSD')),m:num(g('mUSD')),t:num(g('tUSD'))}:{c:0,m:0,t:0}};
 const n=cards.findIndex(x=>x.id===c.id);n>=0?cards[n]=c:cards.push(c);
 saveC();render();showTab('tar');window.scrollTo(0,0);toast('Tarjeta guardada');
}
function ask(msg,fn){$('#cT').textContent=msg;$('#cOk').onclick=()=>{$('#dC').close();fn()};$('#dC').showModal()}
function norm(c){const o=x=>({c:num(x&&x.c),m:num(x&&x.m),t:num(x&&x.t)}),dd=s=>s&&String(s).length>=10?+String(s).slice(8,10):0;
 return{id:String(c.id||Math.random().toString(36).slice(2)),banco:String(c.banco||''),nombre:String(c.nombre||''),u4:String(c.u4||''),multi:!!c.multi,limDOP:num(c.limDOP),limUSD:num(c.limUSD),corteDia:+c.corteDia||dd(c.corte),pagoDia:+c.pagoDia||dd(c.pago),vence:c.vence||'',dop:o(c.dop),usd:o(c.usd)}}
cards=cards.map(norm);

/* Pagar */
const PK=[['t','Balance total'],['c','Balance al corte'],['m','Pago mínimo']];
function payRender(){
 const c=cards.find(x=>x.id===payId),cur=c.multi?$('#pc').value:'dop',o=c[cur];
 const sel=(document.querySelector('input[name=pk]:checked')||{}).value||(o.m>0?'m':o.c>0?'c':'t');
 $('#po').innerHTML=PK.map(([k,l])=>`<label class="op"><input type="radio" name="pk" value="${k}" ${k===sel?'checked':''}><span>${l}</span><b>${M(o[k],cur)}</b></label>`).join('');
 $('#pm').value=o[sel]||'';
}
$('#po').onchange=()=>{const c=cards.find(x=>x.id===payId),o=c[c.multi?$('#pc').value:'dop'];$('#pm').value=o[document.querySelector('input[name=pk]:checked').value]||''};
$('#pc').onchange=payRender;
$('#sP').onclick=()=>{
 const c=cards.find(x=>x.id===payId),a=num($('#pm').value),cur=c.multi?$('#pc').value:'dop',o=c[cur];
 if(!a){toast('Escribe un monto mayor que cero');return}
 const k=document.querySelector('input[name=pk]:checked').value,lab=PK.find(p=>p[0]===k)[1];
 hist.push({id:Date.now().toString(36),f:new Date().toISOString(),cid:c.id,tj:(c.nombre||c.banco)+(c.u4?' ••'+c.u4:''),tipo:a===o[k]?lab:'Monto personalizado',mon:cur,monto:a});
 o.t=Math.max(0,o.t-a);o.c=Math.max(0,o.c-a);o.m=Math.max(0,o.m-a);
 saveC();saveH();render();$('#dP').close();toast(c.dop.t===0&&(!c.multi||c.usd.t===0)?'Pago registrado: ¡tarjeta saldada!':'Pago registrado');
};

/* Respaldo (en Ajustes) */
const backup=()=>JSON.stringify({app:'puzzle-tarjetas',fecha:new Date().toISOString(),tarjetas:cards,historial:hist,ajustes:cfg},null,2);
function restore(txt){
 try{const a=JSON.parse(txt),l=Array.isArray(a)?a:a.tarjetas;if(!Array.isArray(l))throw 0;
  ask('Esto reemplazará tus datos actuales por los del respaldo ('+l.length+' tarjetas). ¿Continuar?',()=>{cards=l.map(norm);hist=Array.isArray(a.historial)?a.historial:[];if(a.ajustes)cfg=Object.assign(cfg,a.ajustes);saveC();saveH();saveS();applyTheme();fillCfg();render();toast('Respaldo restaurado')})}
 catch(e){toast('El archivo no es un respaldo válido')}
}
$('#bDl').onclick=()=>saveFile('puzzle-tarjetas-respaldo-'+stamp()+'.json',backup());
$('#bFi').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f);e.target.value=''};
$('#bWp').onclick=()=>ask('Se borrarán todas tus tarjetas y tu historial. Esta acción no se puede deshacer.',()=>{cards=[];hist=[];saveC();saveH();render();toast('Datos borrados')});

/* Ajustes */
function fillCfg(){$('#cn').value=cfg.nombre;$('#ct').value=cfg.tema;$('#ca').value=cfg.aPago;$('#cc').value=cfg.aCorte;$('#cp').value=cfg.aPlastico}
[['cn','nombre'],['ct','tema'],['ca','aPago'],['cc','aCorte'],['cp','aPlastico']].forEach(([id,k])=>$('#'+id).onchange=$('#'+id).oninput=()=>{const v=$('#'+id).value;cfg[k]=typeof cfg[k]==='number'?(Math.max(1,parseInt(v))||cfg[k]):v;saveS();applyTheme();render()});

/* Navegación y eventos */
function showTab(t){['res','tar','his','add','cfg'].forEach(k=>$('#p-'+k).classList.toggle('hd',k!==t));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{b.dataset.t==='add'?openForm(null):showTab(b.dataset.t);window.scrollTo(0,0)});
$('#xF').onclick=()=>showTab('tar');$('#sF').onclick=saveForm;$('#multi').onchange=toggleUsd;
$('#vence').oninput=e=>{const d=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>$('#'+b.dataset.x).close());
['q','fb','fm','fe','so'].forEach(k=>$('#'+k).oninput=render);
$('#gr').onclick=e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const id=b.closest('.card').dataset.id,c=cards.find(x=>x.id===id);
 if(b.dataset.a==='tog'){const d=b.nextElementSibling,h=d.classList.toggle('hd');b.setAttribute('aria-expanded',String(!h));h?opened.delete(id):opened.add(id);return}
 if(b.dataset.a==='edit')openForm(id);
 if(b.dataset.a==='del')ask('¿Eliminar '+(c.nombre||c.banco)+'? Esta acción no se puede deshacer.',()=>{cards=cards.filter(x=>x.id!==id);saveC();render();toast('Tarjeta eliminada')});
 if(b.dataset.a==='pay'){payId=id;$('#po').innerHTML='';$('#pT').textContent='Pagar '+(c.nombre||c.banco);$('#pc').value='dop';$('#pcW').classList.toggle('hd',!c.multi);payRender();$('#dP').showModal()}
};
applyTheme();fillCfg();render();showTab('tar');
</script>
</body>
</html>
